<!doctype html>
<html lang="en">
  <head>
    <title>Jesse Proulx - Professional Website</title>
    <meta charset="UTF-8" />
    <meta name="author" content="Jesse Proulx" />

    <!-- <link rel="icon" type="image/png" href="pictures/icon/hammer.png?v=2" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @keyframes scrollBlock {
        from {
          left: -30px;
        }
        to {
          left: 120px;
        }
      }

      #flag {
        width: 350px;
      }

      #wordmark {
        position: absolute;
        bottom: 30px;
        right: 30px;
        width: 150px;
      }

      #loadbar {
        position: relative;
        overflow: hidden;
        width: 120px;
        height: 15px;
        border: solid 1px white;
        border-radius: 5px;
        padding: 2px;
      }

      #loadbar span {
        animation: scrollBlock 1s linear infinite;
        position: absolute;
        width: 10px;
        height: 15px;
        background-color: #0058e6;
        border-radius: 3px;
        background: linear-gradient(
          to bottom,
          #2838c7 0%,
          #5979ef 25%,
          #869ef3 45%,
          #5979ef 65%,
          #2838c7 100%
        );
      }

      #loadbar span:nth-child(2) {
        animation-delay: 0.1s;
      }

      #loadbar span:nth-child(3) {
        animation-delay: 0.2s;
      }

      #poweron {
        position: fixed;
        inset: 0;
        border-color: white;
        border-radius: 6px;
        background-color: black;
      }

      #bootscreen {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        inset: 0;
        position: fixed;
        background-color: black;
      }

      #desktop {
        inset: 0;
        position: fixed;
        display: none;
        background: linear-gradient(
          to bottom,
          #4a90d9 0%,
          #87ceeb 55%,
          #7cb342 58%,
          #558b2f 100%
        );
      }

      #taskbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 30px;
        background: linear-gradient(to bottom, #245edb, #1941a5);
        display: flex;
        align-items: center;
        padding: 0 4px 0 0;
      }

      .win {
        position: absolute;
        flex-direction: column;
        display: none;
        background-color: white;
        border: 2px solid #0058e6;
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
        width: 600px;
        height: 500px;
        box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      }

      .titlebar {
        background: linear-gradient(to right, #0058e6, #3f9dff);
        color: white;
        border-top-left-radius: 6px;
        border-top-right-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 6px;
      }

      #startbtn {
        background: linear-gradient(to bottom, #5fb75f, #3c8f3c);
        color: white;
        border: none;
        padding: 8px 20px;
        border-top-right-radius: 12px;
        border-bottom-right-radius: 12px;
        font-weight: bold;
        height: 100%;
      }

      #startmenu {
        position: fixed;
        left: 0;
        bottom: 34px;
        background-color: #f0f0f0;
        border: 2px solid #0058e6;
        flex-direction: column;
        min-width: 180px;
      }

      .icon {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 75px;
        text-align: center;
        cursor: pointer;
        padding: 10px;
      }

      .icon img {
        width: 48px;
        height: 48px;
      }

      .icon span {
        color: white;
        font-size: 12px;
        text-shadow: 1px 1px 2px black;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div id="poweron">
      <button id="powerbtn">⏻</button>
    </div>
    <div id="bootscreen">
      <img
        id="flag"
        src="src/pictures/bootup_icons/windows_xp_logo.png"
        alt="microsoft xp logo"
      />
      <div id="loadbar">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <img
        id="wordmark"
        src="src/pictures/bootup_icons/microsoft_logo.png"
        alt="official microsoft logo"
      />
    </div>
    <div id="desktop">
      <div class="icon" data-win="mycomputer">
        <img src="src/pictures/desktop_icons/My Computer.png" alt="" />
        <span>My Computer</span>
      </div>
      <div class="icon" data-win="mydocument">
        <img src="src/pictures/desktop_icons/My Documents.png" alt="" />
        <span>My Documents</span>
      </div>
      <div class="icon" data-win="recyclebin">
        <img src="src/pictures/desktop_icons/Recycle Bin (empty).png" alt="" />
        <span>Recycle Bin</span>
      </div>
      <div class="icon" data-win="internetexplorer">
        <img src="src/pictures/desktop_icons/Internet Explorer 6.png" alt="" />
        <span>Internet Explorer</span>
      </div>
    </div>
    <div id="taskbar">
      <button id="startbtn">Start</button>
    </div>
    <div class="win" id="win-mycomputer">
      <div class="titlebar">My Computer<button class="close">×</button></div>
    </div>
    <div class="win" id="win-mydocument">
      <div class="titlebar">My Document<button class="close">×</button></div>
    </div>
    <div class="win" id="win-recyclebin">
      <div class="titlebar">Recycle Bin<button class="close">×</button></div>
    </div>
    <div class="win" id="win-internetexplorer">
      <div class="titlebar">
        Internet Explorer
        <button class="close">×</button>
      </div>
    </div>
    <div id="startmenu" style="display: none">
      <button class="icon" data-win="mycomputer">My Computer</button>
    </div>
    <script>
      const poweron = document.getElementById("poweron");
      const bootscreen = document.getElementById("bootscreen");
      const powerbutton = document.getElementById("powerbtn");
      const desktop = document.getElementById("desktop");
      const taskbar = document.getElementById("taskbar");
      const icons = document.querySelectorAll(".icon");
      const closeButtons = document.querySelectorAll(".close");
      const startbtn = document.getElementById("startbtn");
      const startmenu = document.getElementById("startmenu");

      taskbar.style.display = "none";

      powerbutton.addEventListener("click", () => {
        poweron.style.display = "none";
        bootscreen.style.display = "flex";

        setTimeout(() => {
          bootscreen.style.display = "none";
          desktop.style.display = "block";
          taskbar.style.display = "flex";

          const chime = new Audio("src/audio/startup.mp3");
          chime.volume = 1;
          async function boot() {
            try {
              await chime.play();
            } catch (error) {
              console.log("Error: Audio cannot be played", error);
            }
          }
          boot();
        }, 5000);
      });

      icons.forEach(function (icon) {
        icon.addEventListener("click", () => {
          const target = icon.dataset.win;
          const win = document.getElementById("win-" + target);
          win.style.display = "flex";
          const newButton = document.createElement("button");
          newButton.textContent = icon.textContent;
          win.taskbarButton = newButton;
          taskbar.append(newButton);
          newButton.addEventListener("click", () => {
            if (win.style.display === "none") {
              win.style.display = "flex";
            } else {
              win.style.display = "none";
            }
          });
        });
      });

      startbtn.addEventListener("click", () => {
        if (startmenu.style.display === "none") {
          startmenu.style.display = "flex";
        } else {
          startmenu.style.display = "none";
        }
      });
      closeButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const win = btn.closest(".win");
          win.style.display = "none";
          win.taskbarButton.remove();
        });
      });

      let draggedWin = null;
      let isDragging = false;
      const titlebars = document.querySelectorAll(".titlebar");
      let offsetX = 0;
      let offsetY = 0;

      titlebars.forEach((titlebar) => {
        titlebar.addEventListener("mousedown", (e) => {
          isDragging = true;
          draggedWin = titlebar.closest(".win");
          const rect = draggedWin.getBoundingClientRect();
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
        });
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
        draggedWin = null;
      });

      document.addEventListener("mousemove", (e) => {
        if (isDragging) {
          const maxX = window.innerWidth - draggedWin.offsetWidth;
          const maxY =
            window.innerHeight - draggedWin.offsetHeight - taskbar.offsetHeight;
          const clampedX = Math.min(maxX, Math.max(0, e.clientX - offsetX));
          const clampedY = Math.min(maxY, Math.max(0, e.clientY - offsetY));
          draggedWin.style.left = clampedX + "px";
          draggedWin.style.top = clampedY + "px";
        }
      });
    </script>
  </body>
</html>
