<!doctype html>
<html lang="en">
  <head>
    <title>Jesse Proulx - Professional Website</title>
    <meta charset="UTF-8" />
    <meta name="author" content="Jesse Proulx" />

    <!-- <link rel="icon" type="image/png" href="pictures/icon/hammer.png?v=2" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      #poweron {
        position: fixed;
        inset: 0;
        border-color: white;
        border-radius: 6px;
        background-color: black;
      }

      #bootscreen {
        display: none;
        inset: 0;
        position: fixed;
        background-color: black;
        align-items: center;
        justify-content: center;
      }

      #desktop {
        inset: 0;
        position: fixed;
        display: none;
      }

      #taskbar {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34px;
      }

      .win {
        position: absolute;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="poweron">
      <button id="powerbtn">⏻</button>
    </div>
    <div id="bootscreen">
      <span>Booting....</span>
    </div>
    <div id="desktop">
      <div class="icon" data-win="mycomputer">My Computer</div>
    </div>
    <div id="taskbar">
      <button id="startbtn">Start</button>
    </div>
    <div class="win" id="win-mycomputer">
      <div class="titlebar">My Computer <button class="close">×</button></div>
    </div>
    <div id="startmenu" style="display: none">
      <button class="icon" data-win="mycomputer">My Computer</button>
    </div>
    <script>
      const poweron = document.getElementById("poweron");
      const bootscreen = document.getElementById("bootscreen");
      const powerbutton = document.getElementById("powerbtn");
      const desktop = document.getElementById("desktop");
      const taskbar = document.getElementById("taskbar");
      const icons = document.querySelectorAll(".icon");
      const closeButtons = document.querySelectorAll(".close");
      const startbtn = document.getElementById("startbtn");
      const startmenu = document.getElementById("startmenu");

      powerbutton.addEventListener("click", () => {
        poweron.style.display = "none";
        bootscreen.style.display = "flex";

        setTimeout(() => {
          bootscreen.style.display = "none";
          desktop.style.display = "block";
          taskbar.style.display = "flex";

          const chime = new Audio("src/audio/startup.mp3");
          chime.volume = 1;
          async function boot() {
            try {
              await chime.play();
            } catch (error) {
              console.log("Error: Audio cannot be played", error);
            }
          }

          boot();
        }, 5000);
      });

      icons.forEach(function (icon) {
        icon.addEventListener("click", () => {
          const target = icon.dataset.win;
          const win = document.getElementById("win-" + target);
          win.style.display = "flex";
          const newButton = document.createElement("button");
          newButton.textContent = icon.textContent;
          taskbar.append(newButton);
          newButton.addEventListener("click", () => {
            if (win.style.display === "none") {
              win.style.display = "flex";
            } else {
              win.style.display = "none";
            }
          });
        });
      });

      startbtn.addEventListener("click", () => {
        if (startmenu.style.display === "none") {
          startmenu.style.display = "flex";
        } else {
          startmenu.style.display = "none";
        }
      });
      closeButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const win = btn.closest(".win");
          win.style.display = "none";
        });
      });

      let isDragging = false;
      const titlebar = document.querySelector(".titlebar");
      let offsetX = 0;
      let offsetY = 0;

      titlebar.addEventListener("mousedown", (e) => {
        isDragging = true;
        const win = titlebar.closest(".win");
        const rect = win.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
      });

      document.addEventListener("mousemove", (e) => {
        if (isDragging) {
          const win = titlebar.closest(".win");
          win.style.left = e.clientX - offsetX + "px";
          win.style.top = e.clientY - offsetY + "px";
        }
      });
    </script>
  </body>
</html>
